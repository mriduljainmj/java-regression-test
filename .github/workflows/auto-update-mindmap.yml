name: Auto-Update PROJECT.md

# Portability: update-project-mindmap.py itself does a repo-wide scan (no hardcoded
# folder names), so nothing there needs to change when copied into a real repo.
# Only the `paths:` trigger below is folder-name-agnostic already via extension
# wildcards — no editing needed even if the real repo uses different folder names.
on:
  push:
    branches:
      - develop
      - main
    paths:
      - '**/*.java'
      - '**/*.cs'
      - '**/*.csproj'
      - '**/*.feature'
      - '!PROJECT.md'

jobs:
  update-mindmap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Need previous commit for git diff
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Get changed files
        id: changed-files
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            FILES=$(git diff --name-only HEAD~1 HEAD)
          else
            FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }})
          fi
          {
            echo "files<<EOF"
            echo "$FILES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Update PROJECT.md
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.files }}
        run: |
          python3 update-project-mindmap.py --auto-commit
      
      - name: Push updates
        if: always()
        run: |
          # Push if local branch is ahead (commit was created by updater)
          if [ "$(git rev-list --count origin/${{ github.ref_name }}..HEAD)" -gt 0 ]; then
            git push origin HEAD:${{ github.ref_name }}
            echo "✅ PROJECT.md updates pushed"
          else
            echo "ℹ️  No new commit to push"
          fi
