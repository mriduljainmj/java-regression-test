# Step 2 of the flow: after the (manually reviewed) test PR merges to main,
# run the full Cucumber regression suite against the current code.
name: Cucumber regression

on:
  push:
    branches: [main, develop]
    paths:
      - "java-component/**"
      - "dotnet-component/**"
      - "**/*.cs"
      - "**/*.csproj"
  pull_request:
    branches: [main, develop]
    paths:
      - "java-component/**"
      - "dotnet-component/**"
      - "**/*.cs"
      - "**/*.csproj"

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      - name: Run Java regression suite
        run: |
          echo "Running Java regression tests..."
          if [ -f java-component/pom.xml ]; then
            mvn -f java-component/pom.xml --batch-mode verify
          else
            echo "No Java test project found (java-component/pom.xml)"
          fi

      - name: Run .NET regression suite
        run: |
          echo "=========================================="
          echo "Running .NET regression tests..."
          echo "=========================================="
          if [ -f dotnet-component/BP.csproj ]; then
            cd dotnet-component

            echo "Cleaning stale build artifacts to avoid nested output-path pollution..."
            rm -rf bin obj bin-tests obj-tests TestResults

            dotnet test BP.Tests.csproj --nologo --verbosity minimal --results-directory TestResults --logger "trx;LogFileName=dotnet-tests.trx"
            TEST_RESULT=$?

            # Generate a readable BDD HTML report (SpecFlow LivingDoc)
            export PATH="$PATH:$HOME/.dotnet/tools"
            dotnet tool update --global SpecFlow.Plus.LivingDoc.CLI --version 3.* || true
            "$HOME/.dotnet/tools/livingdoc" test-assembly bin-tests/Debug/net9.0/BP.Tests.dll -t TestResults/dotnet-tests.trx -o TestResults/dotnet-livingdoc.html || true

            cd ..

            if [ $TEST_RESULT -ne 0 ]; then
              echo "❌ .NET tests failed"
              exit $TEST_RESULT
            fi
            echo "✓ .NET tests passed"
          else
            echo "No .NET project found (dotnet-component/BP.csproj)"
          fi

      - name: Upload Cucumber report (Java)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report-java
          path: java-component/target/cucumber-report.*
          if-no-files-found: warn

      - name: Upload .NET test results (TRX)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: "**/TestResults/**/*.trx"
          if-no-files-found: warn

      - name: Upload .NET BDD report (LivingDoc HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report-dotnet
          path: dotnet-component/TestResults/dotnet-livingdoc.html
          if-no-files-found: warn
