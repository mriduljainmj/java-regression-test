# Step 2 of the flow: after the (manually reviewed) test PR merges, run the
# regression suite for the component that changed — Java (mvn verify) and/or
# .NET (dotnet test). A paths filter runs only the suite(s) actually affected.
#
# Portability: like generate-tests.yml, everything INSIDE the job is driven by
# repository variables (TESTGEN_COMPONENT_DIR, TESTGEN_DOTNET_COMPONENT_DIR,
# TESTGEN_DOTNET_TEST_PROJECT — Settings → Actions → Variables), defaulting to
# this demo repo's layout. Only the top-level `paths:` trigger below can't be
# dynamic (GitHub evaluates it before vars are available) — edit the
# dotnet-component/** entry when copying this into a repo with a different
# .NET folder name; the extension-based entries already work regardless.
name: Cucumber regression

on:
  push:
    branches: [main, develop,ui-feature]
    paths:
      - "**/*.java"
      - "dotnet-component/**"
      - "**/*.cs"
      - "**/*.csproj"
  pull_request:
    branches: [main, develop]
    paths:
      - "**/*.java"
      - "dotnet-component/**"
      - "**/*.cs"
      - "**/*.csproj"

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Decide which component(s) changed so we only run the relevant suite.
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            java:
              - '**/*.java'
            dotnet:
              - '${{ vars.TESTGEN_DOTNET_COMPONENT_DIR || 'dotnet-component' }}/**'
              - '**/*.cs'
              - '**/*.csproj'

      # Criticality gate: skip the suite when this push only touches controllers whose
      # criticality is set to skip in PROJECT.md (QA-owned). Non-controller / mixed
      # changes still run. Only push events are gated; PR checks always run in full.
      - name: Criticality gate
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            CHANGED="$(git show --name-only --pretty='' "${{ github.sha }}")"
            SKIP="$(CHANGED_FILES="$CHANGED" python3 testgen-agent/criticality_gate.py)"
            HIGH="$(MODE=high CHANGED_FILES="$CHANGED" python3 testgen-agent/criticality_gate.py)"
          else
            SKIP="false"
            HIGH="false"
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          echo "high=$HIGH" >> "$GITHUB_OUTPUT"
          echo "criticality gate → skip=$SKIP high=$HIGH"

      # ADO-first gate: verify the parent ticket has required details and that
      # acceptance criteria have keyword coverage in the current code diff.
      - name: ADO source-of-truth precheck
        id: ado_gate
        working-directory: testgen-agent
        env:
          AZDO_ORG_URL: ${{ secrets.AZDO_ORG_URL }}
          AZDO_PROJECT: ${{ secrets.AZDO_PROJECT }}
          AZDO_PAT: ${{ secrets.AZDO_PAT }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          import sys

          sys.path.insert(0, os.path.join(os.getcwd(), "testgen"))
          from ado import (  # noqa: E402
              criteria_coverage_report,
              extract_work_item_id,
              fetch_work_item_details,
              validate_work_item_requirements,
          )

          def git(args):
              try:
                  return subprocess.run(["git", *args], capture_output=True, text=True, check=True).stdout.strip()
              except Exception:
                  return ""

          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          sha = os.environ.get("GITHUB_SHA", "HEAD")
          out = os.environ.get("GITHUB_OUTPUT", "")

          def set_output(key, value):
              with open(out, "a", encoding="utf-8") as fh:
                  fh.write(f"{key}={value}\n")

          def set_multiline_output(key, value):
              with open(out, "a", encoding="utf-8") as fh:
                  fh.write(f"{key}<<EOF\n{value}\nEOF\n")

          # Enforce ADO-first for push runs; PR runs keep current behavior.
          if event_name != "push":
              set_output("ado_ok", "true")
              set_output("ado_reason", "not_push")
              set_multiline_output("ado_evidence", "ADO strict gate skipped for non-push event")
              raise SystemExit(0)

          head_message = git(["log", "-1", "--format=%B", sha])
          work_item_id = (os.environ.get("AZDO_WORK_ITEM_ID", "").strip() or extract_work_item_id(head_message) or "")
          if not work_item_id:
              set_output("ado_ok", "false")
              set_output("ado_reason", "missing_work_item_id")
              set_multiline_output(
                  "ado_evidence",
                  "No AB#/ADO-/WI- id found in the commit message and AZDO_WORK_ITEM_ID is empty.",
              )
              raise SystemExit(0)

          details = fetch_work_item_details(
              org_url=os.environ.get("AZDO_ORG_URL", ""),
              project=os.environ.get("AZDO_PROJECT", ""),
              pat=os.environ.get("AZDO_PAT", ""),
              work_item_id=work_item_id,
          )
          ok, reason = validate_work_item_requirements(details)
          if not ok:
              mapped_reason = {
                  "missing_work_item_id": "ado_context_missing",
                  "missing_ado_credentials": "ado_context_missing",
                  "ado_fetch_failed": "ado_context_missing",
                  "missing_description": "ado_acceptance_missing",
                  "missing_acceptance_criteria": "ado_acceptance_missing",
              }.get(reason, "ado_context_missing")
              evidence = (
                  f"work_item=AB#{work_item_id}; reason={reason}; error={details.error or 'n/a'}; "
                  f"has_description={'yes' if details.description else 'no'}; "
                  f"has_acceptance={'yes' if details.acceptance_criteria else 'no'}"
              )
              set_output("ado_ok", "false")
              set_output("ado_reason", mapped_reason)
              set_multiline_output("ado_evidence", evidence)
              raise SystemExit(0)

          changed_files = [ln for ln in git(["show", "--name-only", "--pretty=", sha]).splitlines() if ln.strip()]
          git_diff = git(["show", "--pretty=format:", "--patch", sha])
          coverage = criteria_coverage_report(
              acceptance_criteria=details.acceptance_criteria,
              git_diff=git_diff,
              changed_files=changed_files,
          )
          if not coverage.get("covered"):
              missing = coverage.get("missing") or []
              preview = "\n".join(f"- {m}" for m in missing[:8])
              evidence = (
                  f"work_item=AB#{work_item_id}; {coverage.get('summary', '')}\n"
                  f"Changed files:\n" + "\n".join(f"- {p}" for p in changed_files[:40])
              )
              if preview:
                  evidence += "\nMissing criteria:\n" + preview
              set_output("ado_ok", "false")
              set_output("ado_reason", "ado_criteria_mismatch")
              set_multiline_output("ado_evidence", evidence)
              raise SystemExit(0)

          set_output("ado_ok", "true")
          set_output("ado_reason", "ok")
          set_multiline_output("ado_evidence", f"work_item=AB#{work_item_id}; {coverage.get('summary', '')}")
          PY

      - if: steps.ado_gate.outputs.ado_ok == 'true' && steps.changes.outputs.java == 'true' && steps.gate.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - if: steps.ado_gate.outputs.ado_ok == 'true' && steps.changes.outputs.dotnet == 'true' && steps.gate.outputs.skip != 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Run Java regression suite
        id: java_tests
        if: steps.ado_gate.outputs.ado_ok == 'true' && steps.changes.outputs.java == 'true' && steps.gate.outputs.skip != 'true'
        continue-on-error: true
        env:
          TESTGEN_COMPONENT_DIR: ${{ vars.TESTGEN_COMPONENT_DIR || 'java-component' }}
        run: |
          set +e
          mvn -f "$TESTGEN_COMPONENT_DIR/pom.xml" --batch-mode verify
          TEST_RESULT=$?
          set -e
          if [ $TEST_RESULT -ne 0 ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
            if [ "${{ steps.gate.outputs.high }}" = "true" ]; then
              echo "::error::High severity test failed (Java regression)."
            else
              echo "::error::Java regression tests failed"
            fi
            # Do not fail fast here; allow post-steps (artifacts/ADO) to run.
            exit 0
          fi
          echo "failed=false" >> "$GITHUB_OUTPUT"

      - name: Run .NET regression suite
        id: dotnet_tests
        if: steps.ado_gate.outputs.ado_ok == 'true' && steps.changes.outputs.dotnet == 'true' && steps.gate.outputs.skip != 'true' && !(steps.java_tests.outputs.failed == 'true' && steps.gate.outputs.high == 'true')
        continue-on-error: true
        # Stop running additional test-suite steps if Java already failed with HIGH severity.
        working-directory: ${{ vars.TESTGEN_DOTNET_COMPONENT_DIR || 'dotnet-component' }}
        env:
          TESTGEN_DOTNET_TEST_PROJECT: ${{ vars.TESTGEN_DOTNET_TEST_PROJECT || 'BP.Tests.csproj' }}
        run: |
          echo "Cleaning stale build artifacts to avoid nested output-path pollution..."
          rm -rf bin obj bin-tests obj-tests TestResults

          dotnet test "$TESTGEN_DOTNET_TEST_PROJECT" --nologo --verbosity minimal \
            --results-directory TestResults --logger "trx;LogFileName=dotnet-tests.trx"
          TEST_RESULT=$?

          # Optional readable BDD report (SpecFlow LivingDoc) with a TRX HTML fallback.
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet tool update --global SpecFlow.Plus.LivingDoc.CLI --version 3.* || true

          TEST_DLL_NAME="$(basename "$TESTGEN_DOTNET_TEST_PROJECT" .csproj).dll"
          TEST_DLL="$(find bin-tests -type f -name "$TEST_DLL_NAME" | head -n 1 || true)"
          if [ -n "$TEST_DLL" ] && [ -f "TestResults/dotnet-tests.trx" ]; then
            "$HOME/.dotnet/tools/livingdoc" test-assembly "$TEST_DLL" \
              -t TestResults/dotnet-tests.trx -o TestResults/dotnet-livingdoc.html || true
          else
            echo "::warning::Could not find $TEST_DLL_NAME or dotnet-tests.trx for LivingDoc generation"
          fi

          # If LivingDoc is missing, generate a generic HTML test report from TRX.
          if [ ! -f "TestResults/dotnet-livingdoc.html" ] && [ -f "TestResults/dotnet-tests.trx" ]; then
            dotnet tool update --global dotnet-reportgenerator-globaltool --version 5.* || true
            "$HOME/.dotnet/tools/reportgenerator" \
              -reports:"TestResults/dotnet-tests.trx" \
              -targetdir:"TestResults/trx-html" \
              -reporttypes:"HtmlInline_AzurePipelines;Html" || true
          fi

          if [ $TEST_RESULT -ne 0 ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
            if [ "${{ steps.gate.outputs.high }}" = "true" ]; then
              echo "::error::High severity test failed (.NET regression)."
            else
              echo "::error::.NET tests failed"
            fi
            # Do not fail fast here; allow post-steps (artifacts/ADO) to run.
            exit 0
          fi
          echo "failed=false" >> "$GITHUB_OUTPUT"
          echo ".NET tests passed"

      - name: Upload Cucumber report (Java)
        if: always() && steps.ado_gate.outputs.ado_ok == 'true' && steps.changes.outputs.java == 'true' && steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report-java
          path: ${{ vars.TESTGEN_COMPONENT_DIR || 'java-component' }}/target/cucumber-report.*
          if-no-files-found: warn

      - name: Upload .NET test results (TRX)
        if: always() && steps.ado_gate.outputs.ado_ok == 'true' && steps.changes.outputs.dotnet == 'true' && steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: "**/TestResults/**/*.trx"
          if-no-files-found: warn

      - name: Upload .NET BDD report (LivingDoc HTML)
        if: always() && steps.ado_gate.outputs.ado_ok == 'true' && steps.changes.outputs.dotnet == 'true' && steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report-dotnet
          path: |
            ${{ vars.TESTGEN_DOTNET_COMPONENT_DIR || 'dotnet-component' }}/TestResults/dotnet-livingdoc.html
            ${{ vars.TESTGEN_DOTNET_COMPONENT_DIR || 'dotnet-component' }}/TestResults/trx-html/**
          if-no-files-found: warn

      - name: Log ADO subtask on ADO gate failure
        if: ${{ github.event_name == 'push' && steps.ado_gate.outputs.ado_ok != 'true' }}
        working-directory: testgen-agent
        env:
          AZDO_ORG_URL: ${{ secrets.AZDO_ORG_URL }}
          AZDO_PROJECT: ${{ secrets.AZDO_PROJECT }}
          AZDO_PAT: ${{ secrets.AZDO_PAT }}
          REGRESSION_FAILURE_REASON: ${{ steps.ado_gate.outputs.ado_reason }}
          REGRESSION_FAILURE_EVIDENCE: ${{ steps.ado_gate.outputs.ado_evidence }}
          FAILING_COMPONENT: ADO precheck gate
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
        run: python3 report_regression_failure.py

      # When the suite fails on a protected branch, log a subtask under the ticket
      # that drove the change (falls back to a standalone item if none is referenced).
      # Gated to push events so in-progress PR failures don't spam tickets.
      - name: Log ADO subtask on regression failure
        if: ${{ github.event_name == 'push' && steps.ado_gate.outputs.ado_ok == 'true' && (steps.java_tests.outputs.failed == 'true' || steps.dotnet_tests.outputs.failed == 'true') }}
        working-directory: testgen-agent
        env:
          AZDO_ORG_URL: ${{ secrets.AZDO_ORG_URL }}
          AZDO_PROJECT: ${{ secrets.AZDO_PROJECT }}
          AZDO_PAT: ${{ secrets.AZDO_PAT }}
          REGRESSION_HIGH_SEVERITY: ${{ steps.gate.outputs.high }}
          # Optional: pin every regression subtask to one person (email/UPN). If unset,
          # it uses the parent ticket's assignee, then the commit author.
          ADO_ASSIGNEE: ${{ secrets.ADO_ASSIGNEE }}
          FAILING_COMPONENT: >-
            ${{ (steps.changes.outputs.java == 'true' && steps.changes.outputs.dotnet == 'true') && format('{0} and {1}', vars.TESTGEN_COMPONENT_DIR || 'java-component', vars.TESTGEN_DOTNET_COMPONENT_DIR || 'dotnet-component')
             || (steps.changes.outputs.java == 'true' && (vars.TESTGEN_COMPONENT_DIR || 'java-component'))
             || (vars.TESTGEN_DOTNET_COMPONENT_DIR || 'dotnet-component') }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          REGRESSION_FAILURE_REASON: test_execution_failure
        run: python3 report_regression_failure.py

      - name: Finalize regression status
        if: ${{ always() && (steps.ado_gate.outputs.ado_ok != 'true' || steps.java_tests.outputs.failed == 'true' || steps.dotnet_tests.outputs.failed == 'true') }}
        run: |
          if [ "${{ steps.ado_gate.outputs.ado_ok }}" != "true" ]; then
            echo "::error::ADO source-of-truth gate failed: ${{ steps.ado_gate.outputs.ado_reason }}"
          elif [ "${{ steps.gate.outputs.high }}" = "true" ]; then
            echo "::error::High severity test failed."
          else
            echo "::error::Regression tests failed."
          fi
          exit 1
