# Step 2 of the flow: after the (manually reviewed) test PR merges to main,
# run the full Cucumber regression suite against the current code.
name: Cucumber regression

on:
  push:
    branches: [main, develop]
    paths:
      - "java-component/**"
      - "dotnet-component/**"
      - "**/*.cs"
      - "**/*.csproj"
  pull_request:
    branches: [main, develop]
    paths:
      - "java-component/**"
      - "dotnet-component/**"
      - "**/*.cs"
      - "**/*.csproj"

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      - name: Run regression suite (Java and .NET)
        run: |
          echo "Running Java regression tests..."
          if [ -f java-component/pom.xml ]; then
            mvn -f java-component/pom.xml --batch-mode verify
          else
            echo "No Java test project found (java-component/pom.xml)"
          fi
          
          echo "Running .NET regression tests..."
          if ls dotnet-component/*.csproj >/dev/null 2>&1; then
            for proj in dotnet-component/*.csproj; do
              echo "Running dotnet test $proj"
              dotnet test "$proj" --nologo --verbosity minimal --logger trx
            done
          else
            echo "No .NET test project found (dotnet-component/*.csproj)"
          fi

      - name: Upload Cucumber report (Java)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report-java
          path: java-component/target/cucumber-report.*
          if-no-files-found: warn

      - name: Upload .NET test results (TRX)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: "**/TestResults/**/*.trx"
          if-no-files-found: warn
