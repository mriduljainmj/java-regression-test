# Step 2 of the flow: after the (manually reviewed) test PR merges to main,
# run the full Cucumber regression suite against the current code.
name: Cucumber regression

on:
  push:
    branches: [main, develop]
    paths:
      - "java-component/**"
      - "dotnet-component/**"
      - "**/*.cs"
      - "**/*.csproj"
  pull_request:
    branches: [main, develop]
    paths:
      - "java-component/**"
      - "dotnet-component/**"
      - "**/*.cs"
      - "**/*.csproj"

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      - name: Run regression suite (Java and .NET)
        run: |
          echo "Running Java regression tests..."
          if [ -f java-component/pom.xml ]; then
            mvn -f java-component/pom.xml --batch-mode verify
          else
            echo "No Java test project found (java-component/pom.xml)"
          fi
          
          echo "=========================================="
          echo "Starting .NET application server..."
          echo "=========================================="
          if [ -f dotnet-component/BP.csproj ]; then
            # Build the app first, then start it in the background
            cd dotnet-component
            dotnet build BP.csproj -c Debug --nologo
            dotnet run --no-build > /tmp/app.log 2>&1 &
            APP_PID=$!
            echo "App started with PID: $APP_PID"
            
            # Wait for app to boot
            echo "Waiting for app to boot..."
            sleep 5
            
            echo "=========================================="
            echo "Running .NET regression tests..."
            echo "=========================================="
            # Run the tests
            dotnet test BP.Tests.csproj --nologo --verbosity minimal --logger trx
            TEST_RESULT=$?
            
            # Clean up - stop the app
            echo "=========================================="
            echo "Stopping .NET application..."
            echo "=========================================="
            kill $APP_PID 2>/dev/null || true
            wait $APP_PID 2>/dev/null || true
            
            cd ..
            
            if [ $TEST_RESULT -ne 0 ]; then
              echo "❌ .NET tests failed"
              exit $TEST_RESULT
            fi
            echo "✓ .NET tests passed"
          else
            echo "No .NET project found (dotnet-component/BP.csproj)"
          fi

      - name: Upload Cucumber report (Java)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report-java
          path: java-component/target/cucumber-report.*
          if-no-files-found: warn

      - name: Upload .NET test results (TRX)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: "**/TestResults/**/*.trx"
          if-no-files-found: warn
