# Conversational refinement: when QA labels an agent-generated PR with
# "regen-tests", take their latest comment as guidance and regenerate the tests
# onto the SAME PR branch (updates the PR in place; regression check re-runs).
#
# Flow:
#   1. QA leaves a comment describing the change they want.
#   2. QA adds the `regen-tests` label to the PR.
#   3. This workflow reads the latest human comment + the testgen-meta marker in
#      the PR body (base/head/project_type), reruns the agent with that comment as
#      writes it into testgen-guidance.md, reruns, and pushes to the PR branch.
#   4. The label is removed so it can be re-applied to trigger another round.
#
# Note: only works on same-repo PRs (the agent's own PRs). Fork PRs get a
# read-only token and cannot be pushed to.
name: Refine tests from QA feedback

on:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: refine-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  refine:
    if: github.event.label.name == 'regen-tests'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Parse metadata marker + latest QA comment
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          BODY="$(gh pr view "$PR" --json body -q .body)"
          BASE=$(printf '%s' "$BODY" | grep -oE 'base=[0-9a-fA-F]+' | head -1 | cut -d= -f2)
          HEAD=$(printf '%s' "$BODY" | grep -oE 'head=[0-9a-fA-F]+' | head -1 | cut -d= -f2)
          PTYPE=$(printf '%s' "$BODY" | grep -oE 'project_type=[a-z]+' | head -1 | cut -d= -f2)

          # Latest human comment (skip bot/actions/testgen authors) = the guidance.
          GUIDANCE=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '[.[] | select((.user.login | test("bot|actions|testgen"; "i")) | not)] | last | .body // ""')

          echo "base=$BASE"   >> "$GITHUB_OUTPUT"
          echo "head=$HEAD"   >> "$GITHUB_OUTPUT"
          echo "ptype=$PTYPE" >> "$GITHUB_OUTPUT"
          {
            echo "guidance<<TESTGEN_EOF"
            echo "$GUIDANCE"
            echo "TESTGEN_EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Parsed base=$BASE head=$HEAD project_type=$PTYPE"
          echo "Guidance: $GUIDANCE"

      - name: Guard — require marker + guidance
        env:
          BASE: ${{ steps.meta.outputs.base }}
          HEAD: ${{ steps.meta.outputs.head }}
          GUIDANCE: ${{ steps.meta.outputs.guidance }}
        run: |
          if [ -z "$BASE" ] || [ -z "$HEAD" ]; then
            echo "::error::No testgen-meta marker in PR body — not an agent PR, or created before this feature."
            exit 1
          fi
          if [ -z "$(echo "$GUIDANCE" | tr -d '[:space:]')" ]; then
            echo "::error::No human comment found to use as guidance. Leave a comment describing the change, then re-add the label."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install agent dependencies
        run: pip install -r testgen-agent/requirements.txt

      - name: Clean .NET build artifacts
        env:
          TESTGEN_DOTNET_COMPONENT_DIR: ${{ vars.TESTGEN_DOTNET_COMPONENT_DIR || 'dotnet-component' }}
        run: |
          D="$TESTGEN_DOTNET_COMPONENT_DIR"
          if [ -d "$D" ]; then
            rm -rf "$D/bin" "$D/obj" "$D/bin-tests" "$D/obj-tests" "$D/TestResults"
          fi

      - name: Regenerate tests with QA guidance (push to same PR branch)
        id: run
        working-directory: testgen-agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZDO_ORG_URL: ${{ secrets.AZDO_ORG_URL }}
          AZDO_PROJECT: ${{ secrets.AZDO_PROJECT }}
          AZDO_PAT: ${{ secrets.AZDO_PAT }}
          GUIDANCE: ${{ steps.meta.outputs.guidance }}
          TESTGEN_PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          TESTGEN_FORCE_PROJECT_TYPE: ${{ steps.meta.outputs.ptype }}
          TESTGEN_MODEL_RETRIES: "3"
          TESTGEN_BACKOFF_SECONDS: "20,45,90"
          # Same portability contract as generate-tests.yml — see that file's header.
          TESTGEN_COMPONENT_DIR: ${{ vars.TESTGEN_COMPONENT_DIR || 'java-component' }}
          TESTGEN_DOTNET_COMPONENT_DIR: ${{ vars.TESTGEN_DOTNET_COMPONENT_DIR || 'dotnet-component' }}
          TESTGEN_DOTNET_TEST_PROJECT: ${{ vars.TESTGEN_DOTNET_TEST_PROJECT || 'BP.Tests.csproj' }}
          TESTGEN_UI_COMPONENT_DIR: ${{ vars.TESTGEN_UI_COMPONENT_DIR || 'frontend-react' }}
        run: |
          git config user.name "testgen-agent"
          git config user.email "testgen-agent@users.noreply.github.com"
          # The agent reads guidance from testgen-guidance.md — write the QA comment
          # there for this run (transient; not committed with the generated tests).
          printf '%s\n' "$GUIDANCE" > "$GITHUB_WORKSPACE/testgen-guidance.md"
          # Capture the agent's JSON summary (stdout); logs still stream via stderr.
          set +e
          python main.py \
            --repo "$GITHUB_WORKSPACE" \
            --base "${{ steps.meta.outputs.base }}" \
            --head "${{ steps.meta.outputs.head }}" > "$RUNNER_TEMP/agent_out.json"
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "----- agent summary (stdout) -----"
          cat "$RUNNER_TEMP/agent_out.json" || true
          exit $code

      - name: Comment the outcome on the PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          AGENT_EXIT: ${{ steps.run.outputs.exit_code }}
          GUIDANCE: ${{ steps.meta.outputs.guidance }}
        run: |
          OUT="$RUNNER_TEMP/agent_out.json"
          BODY="$RUNNER_TEMP/comment.md"
          : > "$BODY"

          if [ "${AGENT_EXIT:-1}" != "0" ]; then
            {
              echo "🤖 **Refine run failed.**"
              echo ""
              echo "The agent errored — most often a transient free-model rate limit (429)."
              echo "Re-add the \`regen-tests\` label to retry, or check the Actions log."
            } >> "$BODY"
          else
            WRITTEN=$(jq -r '(.written_files // []) | length' "$OUT" 2>/dev/null || echo 0)
            if [ "${WRITTEN:-0}" -gt 0 ] 2>/dev/null; then
              {
                echo "🤖 **Refined from your guidance** — pushed an update (${WRITTEN} file(s))."
                SUMMARY=$(jq -r '.analysis_summary // ""' "$OUT")
                [ -n "$SUMMARY" ] && { echo ""; echo "> $SUMMARY"; }
                echo ""
                jq -r '(.written_files // [])[] | "- `" + . + "`"' "$OUT"
                PASSED=$(jq -r '.tests_passed' "$OUT")
                REPORT=$(jq -r '.test_report // ""' "$OUT")
                echo ""
                if [ "$PASSED" = "true" ]; then
                  echo "✅ Generated tests passed locally. ${REPORT}"
                elif [ "$PASSED" = "false" ]; then
                  echo "⚠️ Tests still failing after self-correction — needs review. ${REPORT}"
                fi
                echo ""
                echo "The regression check will re-run on the new commit."
              } >> "$BODY"
            else
              {
                echo "🤖 **No change** — the regenerated tests were identical to the current suite, so nothing was pushed."
                NOTE=$(jq -r '.note // ""' "$OUT" 2>/dev/null || echo "")
                [ -n "$NOTE" ] && { echo ""; echo "_${NOTE}_"; }
                echo ""
                echo "Try a more specific instruction — name the exact inputs, status codes, and messages to assert."
              } >> "$BODY"
            fi
          fi

          if [ -n "$(printf '%s' "$GUIDANCE" | tr -d '[:space:]')" ]; then
            G=$(printf '%s' "$GUIDANCE" | head -c 300 | tr '\n' ' ')
            { echo ""; echo "<sub>Guidance used: ${G}</sub>"; } >> "$BODY"
          fi

          cat "$BODY"
          gh pr comment "$PR" --body-file "$BODY"

      - name: Remove the label (so it can be re-applied to run again)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr edit "${{ github.event.pull_request.number }}" --remove-label "regen-tests" || true
