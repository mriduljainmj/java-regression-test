# Conversational refinement: when QA labels an agent-generated PR with
# "regen-tests", take their latest comment as guidance and regenerate the tests
# onto the SAME PR branch (updates the PR in place; regression check re-runs).
#
# Flow:
#   1. QA leaves a comment describing the change they want.
#   2. QA adds the `regen-tests` label to the PR.
#   3. This workflow reads the latest human comment + the testgen-meta marker in
#      the PR body (base/head/project_type), reruns the agent with that comment as
#      TESTGEN_GUIDANCE, and pushes the result to the PR branch.
#   4. The label is removed so it can be re-applied to trigger another round.
#
# Note: only works on same-repo PRs (the agent's own PRs). Fork PRs get a
# read-only token and cannot be pushed to.
name: Refine tests from QA feedback

on:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: refine-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  refine:
    if: github.event.label.name == 'regen-tests'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Parse metadata marker + latest QA comment
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          BODY="$(gh pr view "$PR" --json body -q .body)"
          BASE=$(printf '%s' "$BODY" | grep -oE 'base=[0-9a-fA-F]+' | head -1 | cut -d= -f2)
          HEAD=$(printf '%s' "$BODY" | grep -oE 'head=[0-9a-fA-F]+' | head -1 | cut -d= -f2)
          PTYPE=$(printf '%s' "$BODY" | grep -oE 'project_type=[a-z]+' | head -1 | cut -d= -f2)

          # Latest human comment (skip bot/actions/testgen authors) = the guidance.
          GUIDANCE=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '[.[] | select((.user.login | test("bot|actions|testgen"; "i")) | not)] | last | .body // ""')

          echo "base=$BASE"   >> "$GITHUB_OUTPUT"
          echo "head=$HEAD"   >> "$GITHUB_OUTPUT"
          echo "ptype=$PTYPE" >> "$GITHUB_OUTPUT"
          {
            echo "guidance<<TESTGEN_EOF"
            echo "$GUIDANCE"
            echo "TESTGEN_EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Parsed base=$BASE head=$HEAD project_type=$PTYPE"
          echo "Guidance: $GUIDANCE"

      - name: Guard — require marker + guidance
        env:
          BASE: ${{ steps.meta.outputs.base }}
          HEAD: ${{ steps.meta.outputs.head }}
          GUIDANCE: ${{ steps.meta.outputs.guidance }}
        run: |
          if [ -z "$BASE" ] || [ -z "$HEAD" ]; then
            echo "::error::No testgen-meta marker in PR body — not an agent PR, or created before this feature."
            exit 1
          fi
          if [ -z "$(echo "$GUIDANCE" | tr -d '[:space:]')" ]; then
            echo "::error::No human comment found to use as guidance. Leave a comment describing the change, then re-add the label."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install agent dependencies
        run: pip install -r testgen-agent/requirements.txt

      - name: Clean .NET build artifacts
        run: |
          if [ -d dotnet-component ]; then
            rm -rf dotnet-component/bin dotnet-component/obj dotnet-component/bin-tests dotnet-component/obj-tests dotnet-component/TestResults
          fi

      - name: Regenerate tests with QA guidance (push to same PR branch)
        working-directory: testgen-agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZDO_ORG_URL: ${{ secrets.AZDO_ORG_URL }}
          AZDO_PROJECT: ${{ secrets.AZDO_PROJECT }}
          AZDO_PAT: ${{ secrets.AZDO_PAT }}
          TESTGEN_GUIDANCE: ${{ steps.meta.outputs.guidance }}
          TESTGEN_PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          TESTGEN_FORCE_PROJECT_TYPE: ${{ steps.meta.outputs.ptype }}
          TESTGEN_MODEL_RETRIES: "3"
          TESTGEN_BACKOFF_SECONDS: "20,45,90"
        run: |
          git config user.name "testgen-agent"
          git config user.email "testgen-agent@users.noreply.github.com"
          python main.py \
            --repo "$GITHUB_WORKSPACE" \
            --base "${{ steps.meta.outputs.base }}" \
            --head "${{ steps.meta.outputs.head }}"

      - name: Remove the label (so it can be re-applied to run again)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr edit "${{ github.event.pull_request.number }}" --remove-label "regen-tests" || true
