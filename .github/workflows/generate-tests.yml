# Step 1 of the flow: when component code changes land on main, diff the change,
# generate/update Cucumber regression tests, and open a PR for manual review.
name: Generate regression tests

on:
  push:
    branches: [main]
    paths:
      - "java-component/src/main/**"
      - "dotnet-component/Api/**"
  workflow_dispatch:
    inputs:
      base:
        description: "Base ref/SHA to diff against (empty = parent of HEAD)"
        required: false
        default: ""
      work_item:
        description: "ADO work-item id for ticket context (empty = auto-detect AB#nnn from commits)"
        required: false
        default: ""
      reviewer_input:
        description: "Reviewer guidance fed into generation (authoritative)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    # Don't react to the test PRs this workflow itself produces.
    if: "${{ github.event_name == 'workflow_dispatch' || (github.event.head_commit && !startsWith(github.event.head_commit.message, 'test: ')) }}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The agent runs the project's test command on what it generates and
      # self-corrects from the failures. The component's language is detected at
      # runtime, so both toolchains are set up here (Java + .NET).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install agent dependencies
        run: pip install -r testgen-agent/requirements.txt

      - name: Generate Cucumber tests and open PR
        working-directory: testgen-agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ADO ticket context (all optional — agent skips fetch if unset).
          # ADO_ORG / ADO_PROJECT as repo variables; PAT as a secret.
          ADO_ORG: ${{ vars.ADO_ORG }}
          ADO_PROJECT: ${{ vars.ADO_PROJECT }}
          AZURE_DEVOPS_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
        run: |
          git config user.name "testgen-agent"
          git config user.email "testgen-agent@users.noreply.github.com"
          python main.py \
            --repo "$GITHUB_WORKSPACE" \
            --base "${{ github.event.inputs.base || github.event.before }}" \
            --head "${{ github.sha }}" \
            ${{ github.event.inputs.work_item && format('--work-item {0}', github.event.inputs.work_item) || '' }} \
            --reviewer-input "${{ github.event.inputs.reviewer_input }}"
