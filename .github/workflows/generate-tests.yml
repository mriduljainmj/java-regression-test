# Step 1 of the flow: when component code changes land on main, diff the change,
# generate/update Cucumber regression tests, and open a PR for manual review.
#
# Base-ref tracking: a plain `github.event.before` base means a run that fails
# (model exhausted, validation exhausted, unexpected error — main.py exits non-zero)
# permanently loses that push's diff the moment the NEXT push happens, because
# `before` always advances to the prior push's HEAD regardless of whether this
# workflow actually succeeded on it. To fix that, we track the last commit this
# workflow successfully processed (skipped intentionally, or reached a PR — even a
# PR flagged as failing tests counts, since the diff WAS incorporated) with a git
# tag per branch (`testgen-verified/<branch>`), and only move that tag forward when
# the run succeeds. A failed run leaves the tag where it was, so the next push's
# diff naturally grows to include the unresolved change instead of dropping it.
name: Generate regression tests

on:
  push:
    branches: [main, develop, ui-feature]
    paths:
      - "java-component/src/main/**"
      - "dotnet-component/**"
      - "**/*.cs"
      - "**/*.csproj"
      - "frontend-react/src/**"
      - "**/*.jsx"
      - "**/*.tsx"
      - "**/*.vue"
      - "**/*.svelte"
  workflow_dispatch:
    inputs:
      base:
        description: "Base ref/SHA to diff against (empty = parent of HEAD)"
        required: false
        default: ""
      ado_work_item_id:
        description: "Azure DevOps work item id (optional override; commit message AB#1234 is also detected)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: generate-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    # Don't react to merges of test PRs this workflow itself produces.
    if: "${{ github.event_name == 'workflow_dispatch' || (github.event.head_commit && !startsWith(github.event.head_commit.message, 'test: ') && !contains(github.event.head_commit.message, 'testgen/')) }}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The agent runs `mvn test` on what it generates and self-corrects from
      # the failures, so the job needs a JDK + Maven too.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      # For UI changes the agent runs `npm test` (Playwright + Cucumber) on what it
      # generates and self-corrects from the failures, so the job needs Node too.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Resolve base ref (prefer the last successfully-processed commit)
        id: resolve_base
        run: |
          SAFE_BRANCH="$(echo "${{ github.ref_name }}" | tr '/' '-')"
          TAG="testgen-verified/${SAFE_BRANCH}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          MANUAL_BASE="${{ github.event.inputs.base }}"
          if [ -n "$MANUAL_BASE" ]; then
            echo "base=$MANUAL_BASE" >> "$GITHUB_OUTPUT"
            echo "Using manually specified base: $MANUAL_BASE"
          elif git rev-parse -q --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "base=$TAG" >> "$GITHUB_OUTPUT"
            echo "Using last successfully-processed commit ($TAG -> $(git rev-parse "$TAG")) as base"
          else
            echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
            echo "No prior success tag ($TAG) found; falling back to github.event.before"
          fi

      - name: Install agent dependencies
        run: pip install -r testgen-agent/requirements.txt

      - name: Clean .NET build artifacts
        run: |
          if [ -d dotnet-component ]; then
            rm -rf dotnet-component/bin dotnet-component/obj dotnet-component/bin-tests dotnet-component/obj-tests dotnet-component/TestResults
          fi

      - name: Generate Cucumber tests and open PR
        working-directory: testgen-agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZDO_ORG_URL: ${{ secrets.AZDO_ORG_URL }}
          AZDO_PROJECT: ${{ secrets.AZDO_PROJECT }}
          AZDO_PAT: ${{ secrets.AZDO_PAT }}
          AZDO_WORK_ITEM_ID: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ado_work_item_id || '' }}
          TESTGEN_MODEL_RETRIES: "3"
          TESTGEN_BACKOFF_SECONDS: "20,45,90"
        run: |
          CHANGED_FILES="$(git show --name-only --pretty="" "${GITHUB_SHA}")"
          if echo "$CHANGED_FILES" | grep -E '\.cs$|\.csproj$' >/dev/null 2>&1; then
            export TESTGEN_FORCE_PROJECT_TYPE=dotnet
            echo "Routing override: TESTGEN_FORCE_PROJECT_TYPE=dotnet"
          elif echo "$CHANGED_FILES" | grep -E 'src/main/java/.*\.java$' >/dev/null 2>&1; then
            export TESTGEN_FORCE_PROJECT_TYPE=java
            echo "Routing override: TESTGEN_FORCE_PROJECT_TYPE=java"
          elif echo "$CHANGED_FILES" | grep -E '^frontend-react/src/.*\.(jsx|tsx|js|ts|vue|svelte)$' >/dev/null 2>&1; then
            export TESTGEN_FORCE_PROJECT_TYPE=ui
            echo "Routing override: TESTGEN_FORCE_PROJECT_TYPE=ui"
            # Prepare the UI runner so the agent's `npm test` self-correction works.
            # NOTE: this step runs with working-directory: testgen-agent, so use the
            # absolute workspace path — frontend-react is at the repo root.
            ( cd "$GITHUB_WORKSPACE/frontend-react" && npm install && npx playwright install --with-deps chromium )
          else
            echo "No routing override inferred from HEAD changed files"
          fi

          git config user.name "testgen-agent"
          git config user.email "testgen-agent@users.noreply.github.com"
          python main.py \
            --repo "$GITHUB_WORKSPACE" \
            --base "${{ steps.resolve_base.outputs.base }}" \
            --head "${{ github.sha }}"

      # Only runs if the step above succeeded (main.py exit 0) — a failed run leaves
      # the tag where it was, so the next push's diff still includes this change.
      - name: Mark this commit as successfully processed
        if: success()
        run: |
          TAG="${{ steps.resolve_base.outputs.tag }}"
          git tag -f "$TAG" "${{ github.sha }}"
          git push origin "refs/tags/$TAG" --force
          echo "Moved $TAG -> ${{ github.sha }}"
