# Step 1 of the flow: when component code changes land on main, diff the change,
# generate/update Cucumber regression tests, and open a PR for manual review.
#
# Two problems this workflow solves beyond the obvious:
#
# 1. Base-ref tracking (diff loss on failure): a plain `github.event.before` base
#    means a run that fails (model exhausted, validation exhausted, unexpected
#    error — main.py exits non-zero) permanently loses that push's diff the moment
#    the NEXT push happens, because `before` always advances regardless of whether
#    this workflow actually succeeded. Fixed by tracking the last commit each
#    project type was successfully processed through with a git tag
#    (`testgen-verified/<branch>-<type>`), only moving it forward on success. A
#    failed run leaves its tag where it was, so the next push's diff for that type
#    naturally grows to include the unresolved change instead of dropping it.
#
# 2. Mixed commits (one type silently wins): a single push can touch more than one
#    project type at once (e.g. a backend change alongside a UI change). Picking
#    only one type per run (highest-priority match) means the other type's change
#    in that same commit is never sent to the model — and since the run still
#    "succeeds" for the type it did pick, that type's tag advances too, silently
#    marking the other type's change as resolved when no tests were ever generated
#    for it. Fixed by processing EVERY type present in the diff each run (one
#    `main.py` invocation, one PR, and one tag per type), independently — so one
#    type failing never blocks another type's diff from advancing.
#
# Portability: this workflow is meant to be copied into a real .NET, Java, or UI
# repo, not just run against this demo's fixture apps. Everything INSIDE the job
# (which folder is Java/.NET/UI, the .NET test project's filename) is driven by
# repository variables (Settings → Actions → Variables), defaulting to this demo
# repo's own layout — see the TESTGEN_* vars in the "Generate Cucumber tests" step.
# The ONE thing that can't be made dynamic is the `paths:`/`branches:` trigger
# below — GitHub evaluates triggers before a workflow run exists, so they can't
# reference `vars.*`. When copying this workflow, edit `branches:` and the
# folder-scoped path entries (dotnet-component/**, frontend-react/src/**) to match
# the target repo; the extension-based entries (**/*.java, **/*.cs, **/*.jsx, …)
# already work regardless of folder name.
name: Generate regression tests

on:
	push:
		branches: [main, develop, ui-feature]
		paths:
			- "**/*.java"
			- "dotnet-component/**"
			- "**/*.cs"
			- "**/*.csproj"
			- "frontend-react/src/**"
			- "**/*.jsx"
			- "**/*.tsx"
			- "**/*.vue"
			- "**/*.svelte"
	workflow_dispatch:
		inputs:
			base:
				description: "Base ref/SHA to diff against (empty = parent of HEAD)"
				required: false
				default: ""
			ado_work_item_id:
				description: "Azure DevOps work item id (optional override; commit message AB#1234 is also detected)"
				required: false
				default: ""

permissions:
	contents: write
	pull-requests: write

concurrency:
	group: generate-tests-${{ github.ref }}
	cancel-in-progress: true

jobs:
	generate:
		runs-on: ubuntu-latest
		# Don't react to merges of test PRs this workflow itself produces.
		if: "${{ github.event_name == 'workflow_dispatch' || (github.event.head_commit && !startsWith(github.event.head_commit.message, 'test: ') && !contains(github.event.head_commit.message, 'testgen/')) }}"
		steps:
			- uses: actions/checkout@v4
				with:
					fetch-depth: 0

			- uses: actions/setup-python@v5
				with:
					python-version: "3.12"

			# The agent runs `mvn test` on what it generates and self-corrects from
			# the failures, so the job needs a JDK + Maven too.
			- uses: actions/setup-java@v4
				with:
					distribution: temurin
					java-version: "17"
					cache: maven

			- uses: actions/setup-dotnet@v4
				with:
					dotnet-version: "9.0.x"

			# For UI changes the agent runs `npm test` (Playwright + Cucumber) on what it
			# generates and self-corrects from the failures, so the job needs Node too.
			- uses: actions/setup-node@v4
				with:
					node-version: "20"

			- name: Install agent dependencies
				run: pip install -r testgen-agent/requirements.txt

			- name: Clean .NET build artifacts
				env:
					TESTGEN_DOTNET_COMPONENT_DIR: ${{ vars.TESTGEN_DOTNET_COMPONENT_DIR || 'dotnet-component' }}
				run: |
					D="$TESTGEN_DOTNET_COMPONENT_DIR"
					if [ -d "$D" ]; then
						rm -rf "$D/bin" "$D/obj" "$D/bin-tests" "$D/obj-tests" "$D/TestResults"
					fi

			- name: Generate Cucumber tests and open PRs (one run per detected project type)
				working-directory: testgen-agent
				env:
					OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
					GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
					AZDO_ORG_URL: ${{ secrets.AZDO_ORG_URL }}
					AZDO_PROJECT: ${{ secrets.AZDO_PROJECT }}
					AZDO_PAT: ${{ secrets.AZDO_PAT }}
					AZDO_WORK_ITEM_ID: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ado_work_item_id || '' }}
					TESTGEN_MODEL_RETRIES: "3"
					TESTGEN_BACKOFF_SECONDS: "20,45,90"
					MANUAL_BASE: ${{ github.event.inputs.base }}
					EVENT_BEFORE: ${{ github.event.before }}
					GITHUB_EVENT_NAME: ${{ github.event_name }}
					HEAD_SHA: ${{ github.sha }}
					SAFE_BRANCH_RAW: ${{ github.ref_name }}
					# Same names the agent itself reads (testgen/nodes.py) — setting these as
					# repo Variables when copying this workflow into a real repo is enough;
					# no code or script edits needed. Defaults match this demo repo's layout.
					TESTGEN_COMPONENT_DIR: ${{ vars.TESTGEN_COMPONENT_DIR || 'java-component' }}
					TESTGEN_DOTNET_COMPONENT_DIR: ${{ vars.TESTGEN_DOTNET_COMPONENT_DIR || 'dotnet-component' }}
					TESTGEN_DOTNET_TEST_PROJECT: ${{ vars.TESTGEN_DOTNET_TEST_PROJECT || 'BP.Tests.csproj' }}
					TESTGEN_UI_COMPONENT_DIR: ${{ vars.TESTGEN_UI_COMPONENT_DIR || 'frontend-react' }}
				run: |
					git config user.name "testgen-agent"
					git config user.email "testgen-agent@users.noreply.github.com"

					SAFE_BRANCH="$(echo "$SAFE_BRANCH_RAW" | tr '/' '-')"
					OVERALL_FAILED=0

					ado_gate_check() {
						local base="$1"
						local head="$2"
						ADO_BASE="$base" ADO_HEAD="$head" python3 - <<'PY'
						import os
						import subprocess
						import sys

						sys.path.insert(0, os.path.join(os.getcwd(), "testgen"))
						from ado import (  # noqa: E402
							criteria_source_text,
							criteria_coverage_report,
							extract_work_item_id,
							fetch_work_item_details,
							validate_work_item_requirements,
						)

						def git(args):
							try:
								return subprocess.run(["git", *args], capture_output=True, text=True, check=True).stdout.strip()
							except Exception:
								return ""

						event_name = os.environ.get("GITHUB_EVENT_NAME", "")
						if event_name != "push":
							print("ADO strict gate skipped for non-push event")
							raise SystemExit(0)

						base = os.environ.get("ADO_BASE", "")
						head = os.environ.get("ADO_HEAD", "HEAD")
						head_message = git(["log", "-1", "--format=%B", head])
						work_item_id = os.environ.get("AZDO_WORK_ITEM_ID", "").strip() or extract_work_item_id(head_message) or ""
						if not work_item_id:
							print("ADO precheck failed: missing work item id")
							raise SystemExit(1)

						details = fetch_work_item_details(
							org_url=os.environ.get("AZDO_ORG_URL", ""),
							project=os.environ.get("AZDO_PROJECT", ""),
							pat=os.environ.get("AZDO_PAT", ""),
							work_item_id=work_item_id,
						)
						ok, reason = validate_work_item_requirements(details)
						if not ok:
							print(
								f"ADO precheck failed for AB#{work_item_id}: reason={reason}; error={details.error or 'n/a'}; "
								f"has_description={'yes' if details.description else 'no'}; "
								f"has_acceptance={'yes' if details.acceptance_criteria else 'no'}"
							)
							raise SystemExit(1)

						changed_files = [ln for ln in git(["diff", "--name-only", f"{base}..{head}"]).splitlines() if ln.strip()]
						git_diff = git(["diff", f"{base}..{head}", "--", "."])
						coverage = criteria_coverage_report(
							acceptance_criteria=criteria_source_text(details),
							git_diff=git_diff,
							changed_files=changed_files,
						)
						if not coverage.get("covered"):
							print(f"ADO precheck failed for AB#{work_item_id}: {coverage.get('summary', '')}")
							for item in coverage.get("missing") or []:
								print(f"missing: {item}")
							raise SystemExit(1)

						print(f"ADO precheck passed for AB#{work_item_id}: {coverage.get('summary', '')}")
						PY
					}

					# ---- .NET ----
					TAG="testgen-verified/${SAFE_BRANCH}-dotnet"
					if [ -n "$MANUAL_BASE" ]; then BASE="$MANUAL_BASE"
					elif git rev-parse -q --verify "refs/tags/$TAG" >/dev/null 2>&1; then BASE="$TAG"
					else BASE="$EVENT_BEFORE"; fi
					CHANGED="$(git diff --name-only "$BASE" "$HEAD_SHA" 2>/dev/null || true)"
					if echo "$CHANGED" | grep -E "^${TESTGEN_DOTNET_COMPONENT_DIR}/.*\.(cs|csproj)\$" >/dev/null 2>&1; then
						echo "── [dotnet] base=$BASE (tag=$TAG) ──"
						if ado_gate_check "$BASE" "$HEAD_SHA"; then
							if TESTGEN_FORCE_PROJECT_TYPE=dotnet python main.py --repo "$GITHUB_WORKSPACE" --base "$BASE" --head "$HEAD_SHA"; then
								git tag -f "$TAG" "$HEAD_SHA" && git push origin "refs/tags/$TAG" --force \
									|| echo "[dotnet] WARNING: succeeded but failed to push tag $TAG — a future run may reprocess this diff"
								echo "[dotnet] succeeded"
							else
								echo "[dotnet] FAILED — leaving $TAG in place so a future push retries this diff"
								OVERALL_FAILED=1
							fi
						else
							echo "[dotnet] FAILED ADO precheck — leaving $TAG in place so a future push retries this diff"
							OVERALL_FAILED=1
						fi
					else
						echo "── [dotnet] no relevant changes in $BASE..$HEAD_SHA — skipping ──"
					fi

					# ---- Java ----
					TAG="testgen-verified/${SAFE_BRANCH}-java"
					if [ -n "$MANUAL_BASE" ]; then BASE="$MANUAL_BASE"
					elif git rev-parse -q --verify "refs/tags/$TAG" >/dev/null 2>&1; then BASE="$TAG"
					else BASE="$EVENT_BEFORE"; fi
					CHANGED="$(git diff --name-only "$BASE" "$HEAD_SHA" 2>/dev/null || true)"
					if echo "$CHANGED" | grep -E "^${TESTGEN_COMPONENT_DIR}/src/main/java/.*\.java\$" >/dev/null 2>&1; then
						echo "── [java] base=$BASE (tag=$TAG) ──"
						if ado_gate_check "$BASE" "$HEAD_SHA"; then
							if TESTGEN_FORCE_PROJECT_TYPE=java python main.py --repo "$GITHUB_WORKSPACE" --base "$BASE" --head "$HEAD_SHA"; then
								git tag -f "$TAG" "$HEAD_SHA" && git push origin "refs/tags/$TAG" --force \
									|| echo "[java] WARNING: succeeded but failed to push tag $TAG — a future run may reprocess this diff"
								echo "[java] succeeded"
							else
								echo "[java] FAILED — leaving $TAG in place so a future push retries this diff"
								OVERALL_FAILED=1
							fi
						else
							echo "[java] FAILED ADO precheck — leaving $TAG in place so a future push retries this diff"
							OVERALL_FAILED=1
						fi
					else
						echo "── [java] no relevant changes in $BASE..$HEAD_SHA — skipping ──"
					fi

					# ---- UI ----
					TAG="testgen-verified/${SAFE_BRANCH}-ui"
					if [ -n "$MANUAL_BASE" ]; then BASE="$MANUAL_BASE"
					elif git rev-parse -q --verify "refs/tags/$TAG" >/dev/null 2>&1; then BASE="$TAG"
					else BASE="$EVENT_BEFORE"; fi
					CHANGED="$(git diff --name-only "$BASE" "$HEAD_SHA" 2>/dev/null || true)"
					if echo "$CHANGED" | grep -E "^${TESTGEN_UI_COMPONENT_DIR}/src/.*\.(jsx|tsx|js|ts|vue|svelte)\$" >/dev/null 2>&1; then
						echo "── [ui] base=$BASE (tag=$TAG) ──"
						# NOTE: this step runs with working-directory: testgen-agent, so use the
						# absolute workspace path — the UI app is at the repo root.
						( cd "$GITHUB_WORKSPACE/$TESTGEN_UI_COMPONENT_DIR" && npm install && npx playwright install --with-deps chromium )
						if TESTGEN_FORCE_PROJECT_TYPE=ui python main.py --repo "$GITHUB_WORKSPACE" --base "$BASE" --head "$HEAD_SHA"; then
							git tag -f "$TAG" "$HEAD_SHA" && git push origin "refs/tags/$TAG" --force \
								|| echo "[ui] WARNING: succeeded but failed to push tag $TAG — a future run may reprocess this diff"
							echo "[ui] succeeded"
						else
							echo "[ui] FAILED — leaving $TAG in place so a future push retries this diff"
							OVERALL_FAILED=1
						fi
					else
						echo "── [ui] no relevant changes in $BASE..$HEAD_SHA — skipping ──"
					fi

					if [ "$OVERALL_FAILED" -eq 1 ]; then
						echo "One or more project types failed generation this run — see logs above."
						exit 1
					fi
