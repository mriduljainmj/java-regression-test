# Step 1 of the flow: when component code changes land on main, diff the change,
# generate/update Cucumber regression tests, and open a PR for manual review.
name: Generate regression tests

on:
  push:
    branches: [main, develop]
    paths:
      - "java-component/src/main/**"
      - "BP/**"
      - "dotnet-component/**"
      - "**/*.cs"
      - "**/*.csproj"
  workflow_dispatch:
    inputs:
      base:
        description: "Base ref/SHA to diff against (empty = parent of HEAD)"
        required: false
        default: ""
      ado_work_item_id:
        description: "Azure DevOps work item id (optional override; commit message AB#1234 is also detected)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: generate-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    # Don't react to the test PRs this workflow itself produces.
    if: "${{ github.event_name == 'workflow_dispatch' || (github.event.head_commit && !startsWith(github.event.head_commit.message, 'test: ')) }}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The agent runs `mvn test` on what it generates and self-corrects from
      # the failures, so the job needs a JDK + Maven too.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      - name: Install agent dependencies
        run: pip install -r testgen-agent/requirements.txt

      - name: Generate Cucumber tests and open PR
        working-directory: testgen-agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZDO_ORG_URL: ${{ secrets.AZDO_ORG_URL }}
          AZDO_PROJECT: ${{ secrets.AZDO_PROJECT }}
          AZDO_PAT: ${{ secrets.AZDO_PAT }}
          AZDO_WORK_ITEM_ID: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ado_work_item_id || '' }}
          TESTGEN_MODEL_RETRIES: "3"
          TESTGEN_BACKOFF_SECONDS: "20,45,90"
          TESTGEN_MAX_429_BEFORE_COOLDOWN: "2"
          TESTGEN_RATE_LIMIT_COOLDOWN_SECONDS: "120"
        run: |
          git config user.name "testgen-agent"
          git config user.email "testgen-agent@users.noreply.github.com"
          python main.py \
            --repo "$GITHUB_WORKSPACE" \
            --base "${{ github.event.inputs.base || github.event.before }}" \
            --head "${{ github.sha }}"
