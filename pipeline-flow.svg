<svg width="840" height="1290" viewBox="0 0 840 1290" role="img" xmlns="http://www.w3.org/2000/svg">
<title>From code push to reviewed tests - the full automated flow</title>
<desc>A developer pushes code, merges it, and the pipeline detects Java, .NET, or UI changes. The generator uses the diff, ticket context, and an optional testgen-guidance.md file to create tests. QA reviews the generated PR and can add comments, test cases, or a new feature-file request before triggering a refine pass. After approval, the regression safety net runs and either keeps code and tests aligned or creates or updates the related regression subtask.</desc>
<style>
  svg { background: #ffffff; }
  text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .th { font-size: 14px; font-weight: 500; fill: #222; }
  .ts { font-size: 12px; fill: #5f6b7a; }
  .tl { font-size: 11px; fill: #5f6b7a; }
  .c-blue rect  { fill: #e8f0fe; stroke: #4285f4; stroke-width: 1.5; }
  .c-blue .th   { fill: #1a56c4; }
  .c-gray rect  { fill: #f1f3f5; stroke: #aeb6bf; stroke-width: 1.5; }
  .c-gray .th   { fill: #343a40; }
  .c-teal rect  { fill: #e2f5f1; stroke: #0d9488; stroke-width: 1.5; }
  .c-teal .th   { fill: #0f766e; }
  .c-green rect { fill: #e6f4ea; stroke: #34a853; stroke-width: 1.5; }
  .c-green .th  { fill: #1e7e34; }
  .c-red rect   { fill: #fdecea; stroke: #e5484d; stroke-width: 1.5; }
  .c-red .th    { fill: #b02a37; }
  .c-gold rect  { fill: #fff8e1; stroke: #e0a800; stroke-width: 1.5; }
  .c-gold .th   { fill: #9a6700; }
</style>
<defs>
  <marker id="ah" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8a94a6"/></marker>
</defs>

<text class="th" x="40" y="28" text-anchor="start">From code push to reviewed tests</text>

<!-- spine arrows -->
<line x1="420" y1="102" x2="420" y2="130" stroke="#8a94a6" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="420" y1="182" x2="420" y2="210" stroke="#8a94a6" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="420" y1="262" x2="420" y2="290" stroke="#8a94a6" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="420" y1="342" x2="420" y2="370" stroke="#8a94a6" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="420" y1="422" x2="420" y2="450" stroke="#8a94a6" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="420" y1="502" x2="420" y2="566" stroke="#34a853" stroke-width="1.5" marker-end="url(#ah)"/>
<text class="ts" x="430" y="536" text-anchor="start">pass</text>
<line x1="420" y1="618" x2="420" y2="646" stroke="#8a94a6" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="420" y1="698" x2="420" y2="726" stroke="#8a94a6" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="420" y1="778" x2="420" y2="826" stroke="#34a853" stroke-width="1.5" marker-end="url(#ah)"/>
<text class="ts" x="430" y="805" text-anchor="start">approved</text>
<line x1="420" y1="878" x2="420" y2="906" stroke="#8a94a6" stroke-width="1.5" marker-end="url(#ah)"/>

<!-- parallel: knowledge base -->
<path d="M550,76 L690,76 L690,130" fill="none" stroke="#8a94a6" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ah)"/>
<text class="ts" x="602" y="112" text-anchor="start">in parallel</text>

<!-- left guidance input -->
<path d="M250,236 L290,236" fill="none" stroke="#e0a800" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ah)"/>
<text class="tl" x="160" y="226" text-anchor="start">optional input</text>

<!-- self-correct loop -->
<path d="M290,476 L256,476 L256,316 L290,316" fill="none" stroke="#e5484d" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ah)"/>
<text class="ts" x="48" y="392" text-anchor="start">on failure:</text>
<text class="ts" x="48" y="408" text-anchor="start">rewrite, up to 3x</text>

<!-- QA change loop -->
<path d="M550,752 L592,752 L592,592 L550,592" fill="none" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ah)"/>
<text class="ts" x="598" y="668" text-anchor="start">if QA wants</text>
<text class="ts" x="598" y="684" text-anchor="start">changes</text>

<!-- QA input -->
<path d="M630,752 L550,752" fill="none" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ah)"/>
<text class="tl" x="632" y="736" text-anchor="start">comment dialog</text>

<!-- regression report note -->
<path d="M550,932 L640,932" fill="none" stroke="#8a94a6" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ah)"/>
<text class="tl" x="646" y="928" text-anchor="start">[reports at:</text>
<text class="tl" x="646" y="944" text-anchor="start">java-component/target,</text>
<text class="tl" x="646" y="960" text-anchor="start">dotnet-component/TestResults]</text>

<!-- pass / fail fork -->
<line x1="420" y1="958" x2="228" y2="1006" stroke="#34a853" stroke-width="1.5" marker-end="url(#ah)"/>
<text class="ts" x="322" y="986" text-anchor="start">pass</text>
<line x1="420" y1="958" x2="570" y2="1006" stroke="#e5484d" stroke-width="1.5" marker-end="url(#ah)"/>
<text class="ts" x="520" y="986" text-anchor="end">fail</text>

<!-- dedupe branch -->
<line x1="525" y1="1058" x2="470" y2="1116" stroke="#e5484d" stroke-width="1.5" marker-end="url(#ah)"/>
<text class="ts" x="452" y="1092" text-anchor="end">none open</text>
<line x1="620" y1="1058" x2="690" y2="1116" stroke="#e5484d" stroke-width="1.5" marker-end="url(#ah)"/>
<text class="ts" x="666" y="1092" text-anchor="start">already open</text>

<!-- nodes -->
<g class="c-blue"><rect x="290" y="50" width="260" height="52" rx="10"/><text class="th" x="420" y="72" text-anchor="middle">Developer pushes code</text><text class="ts" x="420" y="90" text-anchor="middle">an API, UI, or backend change</text></g>
<g class="c-gray"><rect x="615" y="130" width="150" height="52" rx="10"/><text class="th" x="690" y="152" text-anchor="middle">Knowledge base</text><text class="ts" x="690" y="170" text-anchor="middle">auto-updated doc</text></g>
<g class="c-gray"><rect x="290" y="130" width="260" height="52" rx="10"/><text class="th" x="420" y="152" text-anchor="middle">AI detects the change</text><text class="ts" x="420" y="170" text-anchor="middle">Java, .NET, or UI</text></g>
<g class="c-gold"><rect x="40" y="206" width="210" height="60" rx="10"/><text class="th" x="145" y="228" text-anchor="middle">testgen-guidance.md</text><text class="ts" x="145" y="246" text-anchor="middle">optional edge cases</text><text class="ts" x="145" y="262" text-anchor="middle">and expected tests</text></g>
<g class="c-gray"><rect x="290" y="210" width="260" height="52" rx="10"/><text class="th" x="420" y="232" text-anchor="middle">Gathers full context</text><text class="ts" x="420" y="250" text-anchor="middle">diff, tests, ticket, guidance</text></g>
<g class="c-gray"><rect x="290" y="290" width="260" height="52" rx="10"/><text class="th" x="420" y="312" text-anchor="middle">Writes / updates the tests</text><text class="ts" x="420" y="330" text-anchor="middle">scenarios + step code</text></g>
<g class="c-gray"><rect x="290" y="370" width="260" height="52" rx="10"/><text class="th" x="420" y="392" text-anchor="middle">Validates the tests</text><text class="ts" x="420" y="410" text-anchor="middle">structure, coverage, glue</text></g>
<g class="c-gray"><rect x="290" y="450" width="260" height="52" rx="10"/><text class="th" x="420" y="472" text-anchor="middle">Runs the tests</text><text class="ts" x="420" y="490" text-anchor="middle">do they all pass?</text></g>
<g class="c-green"><rect x="290" y="566" width="260" height="52" rx="10"/><text class="th" x="420" y="588" text-anchor="middle">Opens a pull request</text><text class="ts" x="420" y="606" text-anchor="middle">with a pass / fail status</text></g>
<g class="c-gray"><rect x="290" y="646" width="260" height="52" rx="10"/><text class="th" x="420" y="668" text-anchor="middle">Regression check on the PR</text><text class="ts" x="420" y="686" text-anchor="middle">catches a broken PR early</text></g>
<g class="c-teal"><rect x="290" y="726" width="260" height="52" rx="10"/><text class="th" x="420" y="748" text-anchor="middle">QA reviews the PR</text><text class="ts" x="420" y="766" text-anchor="middle">approve or request a change</text></g>
<g class="c-gold"><rect x="630" y="718" width="170" height="68" rx="10"/><text class="th" x="715" y="740" text-anchor="middle">PR comment dialog</text><text class="ts" x="715" y="758" text-anchor="middle">short comments</text><text class="ts" x="715" y="774" text-anchor="middle">test cases or new file request</text></g>
<g class="c-green"><rect x="290" y="826" width="260" height="52" rx="10"/><text class="th" x="420" y="848" text-anchor="middle">Approved - merge</text><text class="ts" x="420" y="866" text-anchor="middle">tests join the suite</text></g>
<g class="c-gray"><rect x="290" y="906" width="260" height="52" rx="10"/><text class="th" x="420" y="928" text-anchor="middle">Regression safety net runs</text><text class="ts" x="420" y="946" text-anchor="middle">on the protected branch</text></g>

<g class="c-green"><rect x="70" y="1006" width="260" height="52" rx="10"/><text class="th" x="200" y="1028" text-anchor="middle">Code &amp; tests in sync</text><text class="ts" x="200" y="1046" text-anchor="middle">release with confidence</text></g>
<g class="c-red"><rect x="450" y="1006" width="260" height="52" rx="10"/><text class="th" x="580" y="1028" text-anchor="middle">Is a subtask already open?</text><text class="ts" x="580" y="1046" text-anchor="middle">on the ticket that drove the change</text></g>
<g class="c-red"><rect x="390" y="1116" width="162" height="52" rx="10"/><text class="th" x="471" y="1138" text-anchor="middle">Create a subtask</text><text class="ts" x="471" y="1156" text-anchor="middle">and assign it</text></g>
<g class="c-red"><rect x="620" y="1116" width="150" height="52" rx="10"/><text class="th" x="695" y="1138" text-anchor="middle">Comment on it</text><text class="ts" x="695" y="1156" text-anchor="middle">no duplicate</text></g>

<!-- legend -->
<g class="c-blue"><rect x="40" y="1198" width="14" height="14" rx="3"/></g><text class="ts" x="60" y="1209" text-anchor="start">start</text>
<g class="c-gray"><rect x="108" y="1198" width="14" height="14" rx="3"/></g><text class="ts" x="128" y="1209" text-anchor="start">automated</text>
<g class="c-teal"><rect x="210" y="1198" width="14" height="14" rx="3"/></g><text class="ts" x="230" y="1209" text-anchor="start">human (QA)</text>
<g class="c-green"><rect x="320" y="1198" width="14" height="14" rx="3"/></g><text class="ts" x="340" y="1209" text-anchor="start">success</text>
<g class="c-red"><rect x="410" y="1198" width="14" height="14" rx="3"/></g><text class="ts" x="430" y="1209" text-anchor="start">attention</text>
<g class="c-gold"><rect x="510" y="1198" width="14" height="14" rx="3"/></g><text class="ts" x="530" y="1209" text-anchor="start">inputs / guidance</text>
</svg>
