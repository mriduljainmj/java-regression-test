<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Product Catalog</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">◧</span>
      <div>
        <h1>Product Catalog</h1>
        <p class="sub">Mirrors the Products API contract — for UI automation.</p>
      </div>
    </div>
    <span class="count-badge" data-testid="product-count">0 products</span>
  </header>

  <main class="layout">
    <!-- Add product -->
    <section class="panel" aria-labelledby="add-title">
      <h2 id="add-title">Add a product</h2>
      <form id="add-form" novalidate>
        <label>
          <span>Name</span>
          <input type="text" id="name" data-testid="name-input" placeholder="e.g. Wireless Mouse" autocomplete="off" />
        </label>
        <label>
          <span>Price</span>
          <input type="text" id="price" data-testid="price-input" inputmode="decimal" placeholder="e.g. 49.99" autocomplete="off" />
        </label>
        <button type="submit" class="primary" data-testid="add-btn">Add product</button>
      </form>

      <div class="filter">
        <h3>Filter by price</h3>
        <div class="filter-row">
          <input type="text" id="min-price" data-testid="min-price" inputmode="decimal" placeholder="Min" autocomplete="off" />
          <span class="dash">–</span>
          <input type="text" id="max-price" data-testid="max-price" inputmode="decimal" placeholder="Max" autocomplete="off" />
          <button type="button" data-testid="apply-filter">Apply</button>
          <button type="button" class="ghost" data-testid="clear-filter">Clear</button>
        </div>
      </div>

      <div class="alert" id="alert" data-testid="alert" role="alert" aria-live="polite" hidden></div>
    </section>

    <!-- Catalog -->
    <section class="panel" aria-labelledby="list-title">
      <h2 id="list-title">Catalog</h2>
      <table class="catalog">
        <thead>
          <tr><th>Name</th><th class="right">Price</th><th aria-label="actions"></th></tr>
        </thead>
        <tbody id="rows" data-testid="rows"></tbody>
      </table>
      <p class="empty" id="empty" data-testid="empty" hidden>No products match.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
