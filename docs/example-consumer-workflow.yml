# EXAMPLE — copy this into ANOTHER component repo as
# `.github/workflows/generate-tests.yml`. It pulls the agent from its home repo
# via the reusable action; nothing from testgen-agent is copied into this repo.
#
# Works for a Java (Maven) or .NET (Reqnroll) component — the agent detects which.
name: Generate regression tests

on:
  push:
    branches: [main]
    paths:
      # Point these at YOUR component's source directories.
      - "src/main/**"          # typical Java/Maven
      - "**/Api/**"            # typical .NET
  workflow_dispatch:
    inputs:
      base: { description: "Base ref/SHA", required: false, default: "" }
      work_item: { description: "ADO work-item id", required: false, default: "" }
      reviewer_input: { description: "Reviewer guidance", required: false, default: "" }

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    if: "${{ github.event_name == 'workflow_dispatch' || (github.event.head_commit && !startsWith(github.event.head_commit.message, 'test: ')) }}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: mriduljainmj/java-regression-test/.github/actions/testgen@main
        with:
          base: ${{ github.event.inputs.base || github.event.before }}
          head: ${{ github.sha }}
          work-item: ${{ github.event.inputs.work_item }}
          reviewer-input: ${{ github.event.inputs.reviewer_input }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
